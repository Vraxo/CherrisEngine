name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - run: dotnet build

      # TEMPORARY: surface the failure text as annotations, because job logs are unreachable from here.
      - name: Test
        run: |
          set -o pipefail
          dotnet test --no-build --logger "console;verbosity=normal" 2>&1 | tee /tmp/test.log

      - name: Surface failures
        if: failure()
        run: |
          grep -E "Failed |Error Message|Assert|Expected|Exception|at Cherris" /tmp/test.log | head -80 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | tr -d '\r' | cut -c1-900)"
          done || true

      # The number-field drag is plain JavaScript without a browser, so node can check it directly.
      - run: node tests/js/numberdrag.test.js
