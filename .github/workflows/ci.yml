name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Compiler diagnostics go to the step's log, which a headless session cannot read, so they are also written
      # to a file and repeated as annotations below.
      - run: |
          set -o pipefail
          dotnet build 2>&1 | tee build.log

      - run: dotnet test --no-build --logger "trx;LogFileName=tests.trx"

      # Every error the build printed, as an annotation on the pull request. `dotnet build` stops at the first
      # project that fails, so a break in Overcore hides everything downstream; and a headless session cannot read
      # the step's log. Restore failures ("error NU1101") have no file or line, which is why the fallback below
      # annotates the raw line rather than only matching "<file>(<line>,<col>): error CS####: <message>".
      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          import re

          if not os.path.exists('build.log'):
              print('::error title=Build::dotnet build produced no log to read.')
              raise SystemExit(0)

          with open('build.log', encoding='utf-8', errors='replace') as log:
              lines = [line.rstrip('\n') for line in log]

          # MSBuild diagnostics carry a file, a position and a level; anything else that says "error" is annotated
          # as-is, at error level. A warning is annotated as a warning: the repository has always had a few (nullable
          # mismatches in interop), and marking them failures would bury the errors underneath them.
          located = re.compile(
              r'^(?P<file>.+?\(\d+,\d+\)):\s(?P<level>error|warning)\s(?P<code>[A-Z]+\d+):\s(?P<message>.+)$',
              re.IGNORECASE)

          reported = set()
          errors = 0

          for line in lines:
              text = line.strip()

              if not text:
                  continue

              match = located.match(text)

              if match:
                  code = match['code']
                  level = match['level'].lower()
                  detail = f"{match['message']} ({match['file']})"
              elif re.search(r'\berror\b\s*[A-Z]+\d*\s*:', text, re.IGNORECASE) or text.startswith('error '):
                  code = 'Build'
                  level = 'error'

                  # These lines are usually a summary that repeats a diagnostic, which is what makes them worth
                  # annotating; they are also the ones that can arrive with their location stripped, so say where
                  # in the log they were seen rather than pretending to know the file.
                  detail = text
              else:
                  continue

              key = (level, code, detail)

              if key in reported:
                  continue

              reported.add(key)

              if level == 'error':
                  errors += 1

              print(f'::{level} title={code}::{detail[:900]}')

              if len(reported) >= 50:
                  break

          # The last few lines say how the build ended, which is often the most useful thing of all.
          # The raw lines, uninterrupted: if the pattern above ever misses a location again, this is what shows it.
          print('--- error lines, as written ---')
          for line in lines:
              if 'error CS' in line or 'error MSB' in line or 'error NU' in line:
                  print(f'  {line.strip()[:600]}')

          tail = ' | '.join(line.strip() for line in lines[-8:] if line.strip())
          print(f'Build tail: {tail[:900]}')
          print(f'{errors} error(s) and {len(reported) - errors} warning(s) reported.')
          PY

      # A failing test says why in its own output, which is not visible from a headless session, so each failure is
      # repeated as an annotation on the pull request.
      - name: Report failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ElementTree

          trx = {'trx': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          reported = 0

          for results in glob.glob('**/TestResults/*.trx', recursive=True):
              for result in ElementTree.parse(results).getroot().iterfind('.//trx:UnitTestResult', trx):
                  if result.get('outcome') != 'Failed':
                      continue

                  name = result.get('testName', 'unknown test')
                  message = result.findtext('.//trx:Message', '', trx).strip()
                  stack = result.findtext('.//trx:StackTrace', '', trx).strip()
                  lines = [line.strip() for line in f'{message}\n{stack}'.splitlines() if line.strip()]
                  detail = ' | '.join(lines)[:1500]

                  print(f'::error title=Test failed: {name}::{detail}')
                  reported += 1

          print(f'{reported} failing test(s) reported.')
          PY

      # The number-field drag is plain JavaScript without a browser, so node can check it directly.
      - run: node tests/js/numberdrag.test.js

      # Nothing else in this workflow compiles a shader. The engine loads GLSL at run time, so a shader with a
      # typo in it builds green, tests green, and fails in the editor as a black screen with a log line. That is
      # exactly what happened: `uShadowTexelSize[cascade]` was written one statement above `int cascade = 0;`, and
      # the only thing that ever noticed was somebody running the editor.
      #
      # glslangValidator parses and links GLSL against the real spec and needs no GPU, so it is the one check that
      # can run here. It is built from source rather than downloaded because the release assets live on
      # release-assets.githubusercontent.com, which the sandbox this job was written in cannot reach; the source is
      # reachable from `codeload` everywhere. `-DENABLE_OPT=0` is what drops the SPIRV-Tools submodule, which is
      # needed to emit SPIR-V and not at all to say whether a shader is well-formed; without it the clone is 90 MB
      # heavier for a check that never looks at the output.
      #
      # The build is ~70 s and the check itself is one, so the binary is cached under the glslang version: the
      # version is in the key and nothing else is, which is what makes a stale cache impossible rather than merely
      # unlikely. A cache miss is a slower job, never a wrong one.
      - name: Restore cached GLSL validator
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/glslang/build/StandAlone/glslang
          key: glslang-16.1.0-${{ runner.os }}

      - name: Build GLSL validator
        run: |
          set -eu
          version=16.1.0
          work="$RUNNER_TEMP/glslang"
          if [ ! -x "$work/build/StandAlone/glslang" ]; then
            rm -rf "$work"
            mkdir -p "$work"
            curl -sSL "https://codeload.github.com/KhronosGroup/glslang/tar.gz/refs/tags/$version" -o "$work/src.tgz"
            tar xzf "$work/src.tgz" -C "$work"
            mkdir -p "$work/build"
            cmake -S "$work/glslang-$version" -B "$work/build" \
              -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=0 -DENABLE_HLSL=0 \
              -DBUILD_TESTING=0 -DENABLE_GLSLANG_BINARIES=ON > /dev/null
            cmake --build "$work/build" --target glslang-standalone -j "$(nproc)" > /dev/null
          fi
          "$work/build/StandAlone/glslang" --version | head -1
          echo "GLSLANG=$work/build/StandAlone/glslang" >> "$GITHUB_ENV"

      # Every stage on its own, then the ten pairs the engine actually links into programs. The link is the half
      # that a per-file check misses: a vertex stage can declare `out vec2 vTexCoords` and its fragment stage
      # `in vec3 vTexCoords`, each file legal and the program unbuildable.
      #
      # The pairs are listed here rather than derived from the C# because they are what the renderers ask for by
      # name, and a pair added to a renderer without a line here is a pair nobody is checking.
      # `ShadowShaderTests.TheShadersTheRendererLinksAreTheShadersCiCompiles` reads this list back and asserts it
      # matches what the renderers ask for, so the duplication cannot drift without a test going red.
      - name: Validate shaders
        run: |
          set -eu
          cd src/OvercoreEditor/EditorResources/Shaders
          failed=0

          for shader in *.vert *.frag; do
            if ! output=$("$GLSLANG" "$shader" 2>&1); then
              echo "::error title=Shader stage: $shader::$(echo "$output" | grep -v "^$shader$" | head -6 | tr '\n' '|')"
              failed=1
            fi
          done

          while read -r vertex fragment; do
            [ -z "$vertex" ] && continue
            if ! output=$("$GLSLANG" -l "$vertex" "$fragment" 2>&1); then
              echo "::error title=Shader program: $vertex + $fragment::$(echo "$output" | grep -i error | head -6 | tr '\n' '|')"
              failed=1
            fi
          done <<'PAIRS'
          scene.vert scene.frag
          skin.vert skin.frag
          shadow.vert shadow.frag
          shadow_skinned.vert shadow.frag
          post_quad.vert post_blur.frag
          post_quad.vert post_brightpass.frag
          post_quad.vert post_composite.frag
          debug.vert debug.frag
          grid.vert grid.frag
          skybox.vert skybox.frag
          PAIRS

          if [ "$failed" -ne 0 ]; then
            echo "One or more shaders failed to compile or link. See the annotations above."
            exit 1
          fi

          echo "All shader stages compile and all programs link."
