name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      # Compiler diagnostics go to the step's log, which a headless session cannot read, so they are also written
      # to a file and repeated as annotations below.
      - run: |
          set -o pipefail
          dotnet build 2>&1 | tee build.log

      - run: dotnet test --no-build --logger "trx;LogFileName=tests.trx"

      # Every error the build printed, as an annotation on the pull request. `dotnet build` stops at the first
      # project that fails, so a break in Overcore hides everything downstream; and a headless session cannot read
      # the step's log. Restore failures ("error NU1101") have no file or line, which is why the fallback below
      # annotates the raw line rather than only matching "<file>(<line>,<col>): error CS####: <message>".
      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          import re

          if not os.path.exists('build.log'):
              print('::error title=Build::dotnet build produced no log to read.')
              raise SystemExit(0)

          with open('build.log', encoding='utf-8', errors='replace') as log:
              lines = [line.rstrip('\n') for line in log]

          # MSBuild diagnostics carry a file, a position and a level; anything else that says "error" is annotated
          # as-is, at error level. A warning is annotated as a warning: the repository has always had a few (nullable
          # mismatches in interop), and marking them failures would bury the errors underneath them.
          located = re.compile(
              r'^(?P<file>.+?\(\d+,\d+\)):\s(?P<level>error|warning)\s(?P<code>[A-Z]+\d+):\s(?P<message>.+)$',
              re.IGNORECASE)

          reported = set()
          errors = 0

          for line in lines:
              text = line.strip()

              if not text:
                  continue

              match = located.match(text)

              if match:
                  code = match['code']
                  level = match['level'].lower()
                  detail = f"{match['message']} ({match['file']})"
              elif re.search(r'\berror\b\s*[A-Z]+\d*\s*:', text, re.IGNORECASE) or text.startswith('error '):
                  code = 'Build'
                  level = 'error'

                  # These lines are usually a summary that repeats a diagnostic, which is what makes them worth
                  # annotating; they are also the ones that can arrive with their location stripped, so say where
                  # in the log they were seen rather than pretending to know the file.
                  detail = text
              else:
                  continue

              key = (level, code, detail)

              if key in reported:
                  continue

              reported.add(key)

              if level == 'error':
                  errors += 1

              print(f'::{level} title={code}::{detail[:900]}')

              if len(reported) >= 50:
                  break

          # The last few lines say how the build ended, which is often the most useful thing of all.
          # The raw lines, uninterrupted: if the pattern above ever misses a location again, this is what shows it.
          print('--- error lines, as written ---')
          for line in lines:
              if 'error CS' in line or 'error MSB' in line or 'error NU' in line:
                  print(f'  {line.strip()[:600]}')

          tail = ' | '.join(line.strip() for line in lines[-8:] if line.strip())
          print(f'Build tail: {tail[:900]}')
          print(f'{errors} error(s) and {len(reported) - errors} warning(s) reported.')
          PY

      # A failing test says why in its own output, which is not visible from a headless session, so each failure is
      # repeated as an annotation on the pull request.
      - name: Report failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ElementTree

          trx = {'trx': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          reported = 0

          for results in glob.glob('**/TestResults/*.trx', recursive=True):
              for result in ElementTree.parse(results).getroot().iterfind('.//trx:UnitTestResult', trx):
                  if result.get('outcome') != 'Failed':
                      continue

                  name = result.get('testName', 'unknown test')
                  message = result.findtext('.//trx:Message', '', trx).strip()
                  stack = result.findtext('.//trx:StackTrace', '', trx).strip()
                  lines = [line.strip() for line in f'{message}\n{stack}'.splitlines() if line.strip()]
                  detail = ' | '.join(lines)[:1500]

                  print(f'::error title=Test failed: {name}::{detail}')
                  reported += 1

          print(f'{reported} failing test(s) reported.')
          PY

      # The number-field drag is plain JavaScript without a browser, so node can check it directly.
      - run: node tests/js/numberdrag.test.js
