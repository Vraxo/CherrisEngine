name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - run: dotnet build

      - run: set -o pipefail; dotnet test --no-build 2>&1 | tee test-output.log
      - if: failure()
        run: grep -n -A 14 -E '^\s*Failed [A-Za-z]|^\s*\[FAIL\]' test-output.log | head -160 | sed 's/^/##[error]/'

      # The number-field drag is plain JavaScript without a browser, so node can check it directly.
      - run: node tests/js/numberdrag.test.js
