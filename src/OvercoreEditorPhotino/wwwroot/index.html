<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <base href="/" />
    <!-- Font Awesome is bundled locally so component glyphs render in both the webview and browser host. -->
    <link href="vendor/fontawesome/css/all.min.css?v=7.1.0" rel="stylesheet" />
    <!-- The former app.css, split by concern. Order matters: later sheets win ties, as the single file did. -->
    <link href="css/theme.css?v=15" rel="stylesheet" />
    <link href="css/launcher.css?v=15" rel="stylesheet" />
    <link href="css/editor-chrome.css?v=15" rel="stylesheet" />
    <link href="css/widgets.css?v=15" rel="stylesheet" />
    <link href="css/hierarchy.css?v=15" rel="stylesheet" />
    <link href="css/inspector.css?v=15" rel="stylesheet" />
    <link href="css/console.css?v=15" rel="stylesheet" />
    <link href="css/content-browser.css?v=15" rel="stylesheet" />
    <link href="css/viewport.css?v=15" rel="stylesheet" />
    <link href="css/status.css?v=15" rel="stylesheet" />
    <link href="css/states.css?v=15" rel="stylesheet" />
    <link href="css/scrollbars.css?v=15" rel="stylesheet" />
    <script>
        // Replay the last theme before the first paint, so a window that opens on a non-default theme does
        // not flash the stylesheet's default for a frame. js/theme.js replaces this set when Blazor starts.
        (function () {
            try {
                var tokens = JSON.parse(localStorage.getItem("overcore.theme") || "null");

                if (!tokens) {
                    return;
                }

                var root = document.documentElement;

                for (var name in tokens) {
                    if (Object.prototype.hasOwnProperty.call(tokens, name) && name.indexOf("--theme-") === 0) {
                        root.style.setProperty(name, tokens[name]);
                    }
                }
            } catch (error) {
                // No stored theme, or storage is unavailable: the stylesheet's defaults stand.
            }
        })();
    </script>
</head>
<body>
    <app>Loading the editor…</app>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">✕</a>
    </div>

    <!-- The viewport bridge must exist before the first component mounts. The version is bumped when it changes:
         the editor serves this folder from the build output, and a webview will happily run yesterday's copy. -->
    <script src="js/viewport.js?v=3"></script>
    <script src="js/dock.js"></script>
    <script src="js/numberdrag.js"></script>
    <script src="js/host.js"></script>
    <script src="js/theme.js"></script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
