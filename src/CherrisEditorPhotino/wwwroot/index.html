<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
    <script>
        // Replay the last theme before the first paint, so a window that opens on a non-default theme does
        // not flash the stylesheet's default for a frame. js/theme.js replaces this set when Blazor starts.
        (function () {
            try {
                var tokens = JSON.parse(localStorage.getItem("cherris.theme") || "null");

                if (!tokens) {
                    return;
                }

                var root = document.documentElement;

                for (var name in tokens) {
                    if (Object.prototype.hasOwnProperty.call(tokens, name) && name.indexOf("--theme-") === 0) {
                        root.style.setProperty(name, tokens[name]);
                    }
                }
            } catch (error) {
                // No stored theme, or storage is unavailable: the stylesheet's defaults stand.
            }
        })();
    </script>
</head>
<body>
    <app>Loading the editor…</app>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">✕</a>
    </div>

    <!-- The viewport bridge must exist before the first component mounts. -->
    <script src="js/viewport.js"></script>
    <script src="js/dock.js"></script>
    <script src="js/host.js"></script>
    <script src="js/theme.js"></script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
