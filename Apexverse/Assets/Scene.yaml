GameObjects:
  - Name: SpinningCube
    Transform:
      Position: [0, 0, 0]
      Rotation: [0, 0, 0] # Euler Angles (in degrees)
      Scale: [1, 1, 1]
    Components:
      - Type: MeshRenderer
        Properties:
          Mesh: Cube

  - Name: StaticCube
    Transform:
      Position: [1.5, 0, 0]
      Rotation: [0, 45, 0]
      Scale: [0.5, 0.5, 0.5]
    Components:
      - Type: MeshRenderer
        Properties:
          Mesh: Cube