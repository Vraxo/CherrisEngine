OutlineProfiles:
  - Name: Lightsaber
    Color: [1, 0, 0, 1] # A nice jedi blue
    Thickness: 40.0 # The number of blur passes. Higher is wider/softer.
    Glow: 1.5 # The intensity of the glow. > 0 enables glow mode.
  - Name: Friendly
    Color: [0, 1, 1, 1] # Cyan
    Thickness: 3.0

GameObjects:
  - Name: SkyboxContainer
    Components:
      Skybox:
        # NOTE: This requires 6 images in your Assets folder, named like:
        # Assets/sky/night_right.png, ..._left.png, ..._top.png, ..._bottom.png, ..._back.png, ..._front.png
        CubeMap: sky/day

  - Name: Player
    Components:
      Transform:
        Position: [0, 1, 3] # Start at a good vantage point
        Rotation: [0, 0, 0] # Looking forward (towards -Z)
        Scale: [1, 1, 1]
      PlayerController:
      Camera:

  - Name: SpinningCube
    Components:
      Transform:
        Position: [0, 0, 0]
        Rotation: [0, 0, 0]
        Scale: [1, 1, 1]
      MeshRenderer:
        Mesh: Cube
        Texture: crate
      Spinner:

  - Name: StaticCube
    Components:
      Transform:
        Position: [2.5, 0.5, 0] # Adjusted Y to sit on the ground
        Rotation: [0, 45, 0]
        Scale: [0.1, 2.5, 0.1] # Long and thin like a lightsaber
      MeshRenderer:
        Mesh: Cube
        Texture: White
      PermanentOutline:
        Profile: Lightsaber
        
  - Name: GroundPlane
    Components:
      Transform:
        Position: [0, -0.75, 0]
        Rotation: [0, 0, 0]
        Scale: [1, 1, 1]
      MeshRenderer:
        Mesh: Plane
        Texture: Asphalt
        TextureTiling: [10, 10]